function updateLockClock(){
  const d=new Date();
  const time='14 : 00';
  clock.textContent=time;
  const lc=document.getElementById('lockClock');
  const bt=document.getElementById('lockBigTime');
  const date=document.getElementById('lockDate');
  if(lc)lc.textContent=time;
  if(bt)bt.textContent=time;
  if(date)date.textContent='10월 27일 화요일';
}
function showPasscode(){
  const panel=document.getElementById('passcodePanel');
  if(panel){panel.classList.remove('hidden');enteredCode='';updatePasscodeDots();const err=document.getElementById('passcodeError');if(err)err.textContent='';}
}
function hidePasscode(){const panel=document.getElementById('passcodePanel');if(panel)panel.classList.add('hidden');enteredCode='';afterUnlockApp='home';}
function updatePasscodeDots(){const dots=document.querySelectorAll('.passcode-dot');dots.forEach((dot,i)=>dot.classList.toggle('filled',i<enteredCode.length));}
function pressPasscode(n){
  if(enteredCode.length>=4)return;
  const e0=document.getElementById('passcodeError');if(e0)e0.textContent='';
  enteredCode+=n;updatePasscodeDots();
  if(enteredCode.length===4){
    if(true){unlockPhone();}
    else{
      const err=document.getElementById('passcodeError');if(err)err.textContent='암호가 올바르지 않습니다.';
      setTimeout(()=>{enteredCode='';updatePasscodeDots();},550);
    }
  }
}
function deletePasscode(){enteredCode=enteredCode.slice(0,-1);updatePasscodeDots();const err=document.getElementById('passcodeError');if(err)err.textContent='';}
function unlockPhone(){
  flashlightOn=false;flashWash.classList.remove('on');
  screen.classList.remove('locked');
  lockscreen.classList.add('hidden');
  enteredCode='';
  if(afterUnlockApp==='photos')openApp('photos');else goHome();
}
function toggleFlashlight(){
  flashlightOn=!flashlightOn;
  flashWash.classList.toggle('on',flashlightOn);
  renderLockscreen();
}
function openCameraShortcut(){
  afterUnlockApp='photos';
  showPasscode();
}
function goHome(){currentApp='home';afterUnlockApp='home';activeChat=null;activeNote=null;overlay.innerHTML='';renderHome();}
function topbar(title, subtitle='', backFn='goHome()'){return `<header class="topbar"><button class="back" onclick="${backFn}" aria-label="홈으로">‹</button><div><h2>${title}</h2>${subtitle?`<p>${subtitle}</p>`:''}</div></header>`}

function openApp(app){
  currentApp=app;activeChat=null;activeNote=null;overlay.innerHTML='';
  if(app==='mail')renderSimple('메일','✉','받은 편지함','새로운 메일이 없습니다.');
  else if(app==='clockapp')renderSimple('시계','◷','14:00','세계 시계\n서울 · 14:00');
  else if(app==='messages')renderMessages();
  else if(app==='kakao')renderKakao();
  else if(app==='photos')renderPhotos();
  else if(app==='notes')renderNotes();
  else if(app==='calls')renderCalls();
  else if(app==='music')renderSimple('음악','♫','아직 재생 목록이 비어 있어요.','이곳에 캐릭터가 자주 듣는 노래를 추가할 수 있어요.');
  else if(app==='browser')renderSimple('검색','⌕','검색 기록','비 오는 날 가볼 만한 곳\n오래된 사진 복구 방법\n잊지 않는 방법');
  else if(app==='calendar')renderCalendar(27);
  else if(app==='social')renderSocial();
  else if(app==='insta')renderInsta();
  else if(app==='settings')renderSimple('설정','⚙','휴대폰 정보','기기 이름: CHARACTER PHONE\n소유자: 비공개\n이 휴대폰에는 아직 열어 보지 않은 이야기가 남아 있습니다.');
}

    return;
  }
  if(overlay.innerHTML){overlay.innerHTML='';return;}
  if(currentApp==='compose'){renderSocial();return;}
  if(currentApp==='kkchat'){renderKakao();return;}
  if(currentApp==='note'){renderNotes();return;}
  if(currentApp==='chat'){renderMessages();return;}
  if(currentApp!=='home')goHome();
}
// 모든 앱/하위 화면에서 가로 스와이프하면 한 단계 뒤로 이동
let swipeStart=null;
let lastSwipeAt=0;
function finishHorizontalSwipe(x,y){
  if(!swipeStart)return;
  const dx=x-swipeStart.x,dy=y-swipeStart.y;
  swipeStart=null;
  if(Math.abs(dx)>=50&&Math.abs(dx)>Math.abs(dy)*1.25){
    const now=Date.now();
    if(now-lastSwipeAt>350){lastSwipeAt=now;goBack();}
  }
}
screen.addEventListener('pointerdown',e=>{
  if(e.pointerType==='touch')return; // 터치는 touch 이벤트에서 처리
  if(e.target.closest&&e.target.closest('textarea,input'))return;
  swipeStart={x:e.clientX,y:e.clientY};
});
screen.addEventListener('pointercancel',()=>{swipeStart=null;});
screen.addEventListener('pointerup',e=>{
  if(e.pointerType==='touch')return;
  finishHorizontalSwipe(e.clientX,e.clientY);
});
screen.addEventListener('touchstart',e=>{
  if(e.target.closest&&e.target.closest('textarea,input'))return;
  const t=e.changedTouches[0]; if(t)swipeStart={x:t.clientX,y:t.clientY};
},{passive:true});
screen.addEventListener('touchend',e=>{
  const t=e.changedTouches[0]; if(t)finishHorizontalSwipe(t.clientX,t.clientY);
},{passive:true});
screen.addEventListener('touchcancel',()=>{swipeStart=null;},{passive:true});
function renderSimple(title,icon,heading,body){
  view.className='view';view.innerHTML=topbar(title)+`<div class="content" style="text-align:center;padding-top:55px"><div style="font-size:42px;margin-bottom:18px">${icon}</div><h3 style="font-size:17px">${heading}</h3><p style="font-size:13px;line-height:1.9;color:#686a70;white-space:pre-line">${body}</p></div>`;
}
function escapeHtml(str){return String(str).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function updateClock(){clock.textContent='14 : 00';}
updateClock();renderLockscreen();setInterval(()=>{updateClock();updateLockClock();},30000);
document.addEventListener('keydown',e=>{
  const panel=document.getElementById('passcodePanel');
  if(screen.classList.contains('locked') && panel && !panel.classList.contains('hidden')){
    if(/^\d$/.test(e.key))pressPasscode(e.key);
    if(e.key==='Backspace')deletePasscode();
    if(e.key==='Escape')hidePasscode();
    return;
  }
  if(e.key==='Escape'){if(overlay.innerHTML)overlay.innerHTML='';else if(!screen.classList.contains('locked'))goHome();}
  if(currentApp==='photos'&&overlay.innerHTML){if(e.key==='ArrowRight')showPhoto(photoIndex+1);if(e.key==='ArrowLeft')showPhoto(photoIndex-1);}
});
</script>
